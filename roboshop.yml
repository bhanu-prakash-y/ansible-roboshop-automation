- name: create ec2 instances and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-01c5e6f682ae06599
    ami_id: ami-0220d79f3f480ecf5
    domain_name: bhanudevops.online
    env: dev
    insatnces:
    - mongodb
    - catalogue
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
       instance_type: "t3.micro"
       security_group: "{{ sg_id }}"
       image_id: "{{ ami_id }}"
       name: "{{ item }}-{{ env }}"
       tags:
         project: roboshop
         compenent: "{{ item }}"
         Enivornment: "{{ env }}"
         name: "{{ item }}-{{ env }}"
    loop: "{{ insatnces }}"
    register: ec2_output

  - name: print the output
    ansible.builtin.debug:
       msg: "{{ ec2_output }}"

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}"  # mongodb-dev.bhanudevops.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: true
    loop: "{{ ec2_output.results }}"

  - name: create r53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "roboshop-{{ env }}.{{ domain_name }}" # roboshop-dev.bhanudevops.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      wait: true
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when:  # and
    - item.item == "frontend"
    - action == "create"